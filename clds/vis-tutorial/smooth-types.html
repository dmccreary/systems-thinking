<!DOCTYPE html>
<html lang="en">
    <head>
    <title>Vis Network | Edge Styles | Static smooth curves</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style type="text/css">
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
      }
      #mynetwork {
        width: 500px;
        height: 400px;
        background-color: aliceblue;  /* Light blue drawing canvas */
        border: 1px solid silver;  /* light gray border */
      }
    </style>
  </head>

  <body>
    <h2>Demos of Edge Smooth Curve Types</h2>
    
    <div id="mynetwork">
        <div class="vis-network" tabindex="0" style="position: relative; overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-drag: none; -webkit-tap-highlight-color: rgba(0, 0, 0, 0); width: 100%; height: 100%;">
        <canvas width="1000" style="position: relative; touch-action: none; user-select: none; -webkit-user-drag: none; -webkit-tap-highlight-color: rgba(0, 0, 0, 0); width: 100%; height: 100%;" height="1000">
        </canvas>
    </div>
    <div class="vis-configuration-wrapper">
            <div class="vis-configuration vis-config-item vis-config-s0"></div>
            <div class="vis-configuration vis-config-item vis-config-s0">
                <div class="vis-configuration vis-config-header">edges</div>
            </div>
                <div class="vis-configuration vis-config-item vis-config-s2">
                    <div class="vis-configuration vis-config-label vis-config-s2">
                        <i><b>smooth</b></i>
                    </div>
                    </div>
                <div class="vis-configuration vis-config-item vis-config-s3">
                    <div class="vis-configuration vis-config-label vis-config-s3">enabled:</div>
                    <input type="checkbox" class="vis-configuration vis-config-checkbox"></div>
                    <div class="vis-configuration vis-config-item vis-config-s3">
                        <div class="vis-configuration vis-config-label vis-config-s3">type:</div>
                <select class="vis-configuration vis-config-select">
                    <option value="dynamic">dynamic</option>
                    <option value="continuous">continuous</option>
                    <option value="discrete">discrete</option><option value="diagonalCross">diagonalCross</option>
                    <option value="straightCross">straightCross</option>
                    <option value="horizontal">horizontal</option>
                    <option value="vertical">vertical</option>
                    <option value="curvedCW">curvedCW</option>
                    <option value="curvedCCW">curvedCCW</option>
                    <option value="cubicBezier">cubicBezier</option>
                </select></div><div class="vis-configuration vis-config-item vis-config-s3">
                    <div class="vis-configuration vis-config-label vis-config-s3">forceDirection:</div>
                    <select class="vis-configuration vis-config-select">
                        <option value="horizontal">horizontal</option>
                        <option value="vertical">vertical</option>
                        <option value="none">none</option></select>
                    </div>
                        <div class="vis-configuration vis-config-item vis-config-s3"><div class="vis-configuration vis-config-label vis-config-s3">roundness:</div>
                        <input class="vis-configuration vis-config-range" type="range" min="0" max="1" step="0.05">
                        <input class="vis-configuration vis-config-rangeinput"></div>
                        <div class="vis-configuration vis-config-option-container"></div>
                        <div class="vis-configuration vis-config-button">generate options</div>
                    </div>
    </div>

    <script type="text/javascript">

      // create an array with nodes
      var nodes = [
        { id: 1, label: "Fixed node", x: 0, y: 0, fixed: true },
        { id: 2, label: "Drag me", x: 200, y: -150, physics: false },
        { id: 3, label: "Obstacle", x: 80, y: -80, fixed: true, mass: 10 },
      ];

      // create an array with edges
      var edges = [{ from: 1, to: 2, arrows: "to" }];

      // create a network
      var container = document.getElementById("mynetwork");
      var data = {
        nodes: nodes,
        edges: edges,
      };
      var options = {
        interaction: {
            dragNodes: true,          // Keep node dragging enabled
            dragView: false,          // Disable panning/dragging the view
            zoomView: false,          // Disable zooming
            selectConnectedEdges: false  // Your existing setting
        },
        physics: true,
        background: "aliceblue",
        configure: function (option, path) {
          if (path.indexOf("smooth") !== -1 || option === "smooth") {
            return true;
          }
          return false;
        },
        edges: {
          smooth: {
            type: "continuous",
          },
        },
      };

      var network = new vis.Network(container, data, options);

       // Set initial zoom
       // this code is not working as expected - there is no scaling visible
       network.moveTo({
            scale: 1.2,
            position: {x: 0, y: 0}
        });
    </script>
  

   </body>
</html>
