theme:
  name: material
  logo: img/new-logo.png
  favicon: img/favicon.ico
  palette:
    primary: 'blue'
    accent: 'orange'
  custom_dir: 'theme'
  include_sidebar: true
markdown_extensions:
  - meta
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.snippets
  - pymdownx.emoji
  - pymdownx.tilde
  - pymdownx.tasklist
  - pymdownx.tabbed
# enable LaTeX equation rendering
#  - pymdownx.arithmatex:
#      generic: true
extra_css:
   - css/extra.css
extra_javascript:
    - js/extra.js
    # needed for mathjax to work
    # - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
plugins:
  - search
  - social
  - social_override
extra:
    analytics:
      provider: google
      # https://analytics.google.com/analytics/web/#/a1420179p349994530/admin/streams/table/4433129821
      property: G-ZQMDCX1BVL
